# Vale checks the style of English prose against the Google developer
# documentation style guide. Spelling is the job of typos, and Japanese prose
# is the job of textlint, so neither is checked here.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Google

# Front matter keys and code are not prose.
BlockIgnores = (?s) *(^---\n.*?\n---\n)
TokenIgnores = (<!--.*?-->)

# Decision records name the people who decided: "we" is the honest subject.
Google.We = NO
# Decision records state what will be true from now on.
Google.Will = NO
# The passive voice is common and clear in records of what was decided.
Google.Passive = NO
# Tool and product names decide their own capitalization in headings.
Google.Headings = NO
# Acronyms are expanded in the glossary, not on each first use.
Google.Acronyms = NO
# Overlaps with typos.
Google.Spelling = NO
# Parentheses carry short clarifications throughout these documents.
Google.Parens = NO
# A record title is "<ID>: <Title>", with a capital after the colon.
Google.Colons = NO
# MADR writes `Chosen option: "X", because`, and a quoted literal must not
# swallow the punctuation that follows it.
Google.Quotes = NO
# The rule is a regular expression and misreads clauses that hold "and".
Google.OxfordComma = NO
