# Python-based repository tooling, pinned with hashes in uv.lock.
# Run everything through make; see AGENTS.md and ADR-0004.
[project]
name = "kortopi-tools"
version = "0.0.0"
description = "Repository-level Python tooling. Not a distributable package."
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
# Use the interpreter that mise pins; never download another one.
python-downloads = "never"
python-preference = "only-system"
# Supply chain: ignore releases younger than three days.
exclude-newer = "3 days"

[dependency-groups]
dev = [
  "check-jsonschema==0.39.0",
  "yamllint==1.38.0",
]
