# golangci-lint v2 runs the Go formatters and linters, including go vet.
# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 3m
  modules-download-mode: readonly
  # Also lint the tests that need a database. They carry this build tag, and
  # `make check-all` runs them once they exist.
  build-tags:
    - integration

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/ma-chisuke/kortopi
  exclusions:
    generated: strict

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - gocritic
    - gomoddirectives
    - gosec
    - intrange
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        superseded:
          deny:
            - pkg: io/ioutil
              desc: use io and os
            - pkg: github.com/pkg/errors
              desc: use errors and fmt.Errorf with %w
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: log$
              desc: use log/slog
        # The dialect of PostgreSQL: its package, its driver and the modules
        # of its author that read the password file and the service file of
        # libpq, its SQL parser, and the module that starts its test
        # servers. Only the dialect
        # imports them, with the file of the command that registers it and
        # the tests of the command against PostgreSQL. Every other package,
        # a shared one or the package of another dialect, reaches PostgreSQL
        # through internal/dialect (ADR-0019, ADR-0036). A second dialect
        # gets a rule of its own, like this one.
        postgres:
          files:
            - $all
            - "!**/internal/postgres/**"
            - "!**/cmd/kortopi/dialect_postgres.go"
            - "!**/cmd/kortopi/*_integration_test.go"
          deny:
            - pkg: github.com/ma-chisuke/kortopi/internal/postgres
              desc: code specific to a database goes in the package of its dialect, internal/postgres for PostgreSQL, and every other package reaches it through internal/dialect (ADR-0019)
            - pkg: github.com/jackc/
              desc: the driver of PostgreSQL, and the modules that read the password file and the service file of libpq, belong to its dialect, so code that talks to PostgreSQL goes in internal/postgres (ADR-0019)
            - pkg: github.com/pganalyze/pg_query_go
              desc: the SQL parser of PostgreSQL belongs to its dialect, so code that reads SQL goes in internal/postgres (ADR-0019)
            - pkg: github.com/wasilibs/go-pgquery
              desc: the SQL parser of PostgreSQL belongs to its dialect, so code that reads SQL goes in internal/postgres (ADR-0019)
            - pkg: github.com/testcontainers/testcontainers-go/modules/postgres
              desc: the test servers of PostgreSQL belong to its dialect, so a test that needs one goes in internal/postgres, or uses internal/postgres/pgtest from a test of the command (ADR-0019)
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: write to an io.Writer that the caller passes in, or use log/slog
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  # One line per finding, without a summary after them.
  show-stats: false
  formats:
    text:
      path: stdout
      print-issued-lines: false
      print-linter-name: true
      colors: false
  sort-order:
    - file
    - linter
