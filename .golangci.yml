# golangci-lint v2 runs the Go formatters and linters, including go vet.
# https://golangci-lint.run/docs/configuration/file/
version: "2"

run:
  timeout: 3m
  modules-download-mode: readonly
  # Also lint the tests that need a database. They carry this build tag, and
  # `make check-all` runs them once they exist.
  build-tags:
    - integration

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/ma-chisuke/kortopi
  exclusions:
    generated: strict

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoinits
    - gocritic
    - gomoddirectives
    - gosec
    - intrange
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        superseded:
          deny:
            - pkg: io/ioutil
              desc: use io and os
            - pkg: github.com/pkg/errors
              desc: use errors and fmt.Errorf with %w
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: log$
              desc: use log/slog
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: write to an io.Writer that the caller passes in, or use log/slog
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  # One line per finding, without a summary after them.
  show-stats: false
  formats:
    text:
      path: stdout
      print-issued-lines: false
      print-linter-name: true
      colors: false
  sort-order:
    - file
    - linter
