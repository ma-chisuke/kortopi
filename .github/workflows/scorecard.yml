# OpenSSF Scorecard: supply-chain checks on the repository, published to
# scorecard.dev and uploaded to code scanning.
# When it publishes, Scorecard accepts only a workflow without top-level or job
# env, with no write permission at the top level, and with only these actions
# in its job: https://github.com/ossf/scorecard-action#workflow-restrictions
name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Every Tuesday.
    - cron: 41 2 * * 2

# The job asks for the permissions that it needs; the action's example grants
# read-all here, which ghalint forbids and the job does not use.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the results with the OIDC token of the run
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the results for five days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
