# The release of kortopi (ADR-0030, docs/guides/release.md).
#
# A tag v* pushed to GitHub releases the commit that it points to:
#   gate     the tag is on main, and the check `check` of CI passed on it
#   build    build and pack the binaries, with no write permission
#   attest   sign the provenance of the archives
#   publish  check the provenance, then create the GitHub release
# Run by hand (workflow_dispatch), it is a dry run: it builds the archives of
# the chosen branch and keeps them as an artifact of the run, and publishes
# and attests nothing.
#
# Each job asks for the permissions that it needs. The jobs that run code of
# dependencies (build) hold no token that writes; the jobs that hold one
# (attest, publish) run no such code. No job restores a cache, so nothing
# that another workflow wrote reaches a release.
name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: The version that the dry run puts in the binaries and the names of the archives
        required: true
        default: v0.0.0-dry-run

permissions: {}

# A release is never cancelled halfway; a second run for the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The version of mise itself. mise.toml and mise.lock pin every other tool.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.11.10

jobs:
  gate:
    name: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # read the result of CI on the commit
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of main, to tell whether the tag is on it.
          fetch-depth: 0
      - name: Install mise, gh, and jq
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: gh jq
          cache: false
      - name: make release-gate
        run: make release-gate
        env:
          VERSION: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  build:
    name: build
    needs: gate
    # The gate is skipped in a dry run.
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise, Go, and Trivy
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go trivy
          cache: false
      - name: make release-build
        run: make release-build
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      - name: Keep the archives for the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # sign the attestation with the OIDC token of the run
      attestations: write # store the attestation in the repository
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Attest the provenance of the archives and the checksum file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
      attestations: read # verify the provenance before publishing
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and gh
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: gh
          cache: false
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: make release-publish
        run: make release-publish
        env:
          VERSION: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
